; build and upload: pio run -e upesy_wroom -t upload
; arduino-esp32 core 2.0.17

; the board we used (uPesy ESP32 WROOM devkit)
[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags = -Wall -Wextra -Wno-unused-parameter

; NodeMCU-32S from the kit list, same pin numbers
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags = -Wall -Wextra -Wno-unused-parameter
